<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pompom</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@200;300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-mode="work">
    <div class="app-container">
      <div class="mode-selector">
        <button class="mode-btn active" data-mode="work">Focus</button>
        <button class="mode-btn" data-mode="shortBreak">Short Break</button>
        <button class="mode-btn" data-mode="longBreak">Long Break</button>
      </div>

      <div class="timer-section">
        <div class="dial" id="dial">
          <svg class="dial-svg" viewBox="0 0 200 200" aria-hidden="true">
            <circle class="dial-track" cx="100" cy="100" r="88"></circle>
            <g class="dial-ticks">
              <line x1="100" y1="14" x2="100" y2="24"></line>
              <line x1="167" y1="33" x2="160" y2="40"></line>
              <line x1="186" y1="100" x2="176" y2="100"></line>
              <line x1="167" y1="167" x2="160" y2="160"></line>
              <line x1="100" y1="186" x2="100" y2="176"></line>
              <line x1="33" y1="167" x2="40" y2="160"></line>
              <line x1="14" y1="100" x2="24" y2="100"></line>
              <line x1="33" y1="33" x2="40" y2="40"></line>
            </g>
            <circle
              class="dial-progress"
              id="dial-progress"
              cx="100"
              cy="100"
              r="88"
              stroke-dasharray="553"
              stroke-dashoffset="553"
            ></circle>
          </svg>

          <div class="dial-center">
            <div
              class="time-display"
              id="time-display"
              title="Click to edit minutes"
            >
              25:00
            </div>
            <input
              type="number"
              class="time-edit-input hidden"
              id="time-edit-input"
              min="1"
              max="180"
            />
          </div>
        </div>

        <div class="controls">
          <button class="control-btn" id="start-btn">Start</button>
          <button class="control-btn control-btn-secondary" id="reset-btn">
            Reset
          </button>
        </div>

        <div class="current-task" id="current-task"></div>
      </div>

      <div class="task-section">
        <input
          type="text"
          class="task-input"
          id="task-input"
          placeholder="Press Enter to add a task..."
        />
        <ul class="task-list" id="task-list"></ul>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
